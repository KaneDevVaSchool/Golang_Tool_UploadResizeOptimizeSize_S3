# Vhost cho pictures.vaschools.edu.vn
# App Go chạy binary + systemd, lắng nghe 127.0.0.1:8080 (xem deploy/systemd/s3-upload-tool.service)
#
# deploy.sh tự cài file này ở lần chạy đầu. Sau khi Certbot đã sửa để thêm
# block 443, deploy.sh KHÔNG ghi đè nữa (tránh mất cấu hình SSL) — muốn đổi
# thì sửa trực tiếp /etc/nginx/sites-available/pictures.vaschools.edu.vn.conf
# rồi `sudo nginx -t && sudo systemctl reload nginx`.
#
# Bật HTTPS: sudo bash deploy/setup-https.sh

server {
    listen 80;
    listen [::]:80;
    server_name pictures.vaschools.edu.vn;

    # Upload ảnh có thể khá lớn — khớp UPLOAD_ABSOLUTE_MAX_MB trong .env
    # (mặc định 200). Đặt ở server để áp cho mọi location, kể cả upload chunk.
    client_max_body_size 200m;

    # Chặn nhúng site vào iframe bên khác + không đoán lại MIME type
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- Nén ---
    # App Go đã tự nén (internal/middleware/compress.go) nên gần như mọi
    # response đi qua đây đã có Content-Encoding: gzip và nginx chuyển tiếp
    # nguyên vẹn — không nén chồng.
    #
    # Phần dưới là lưới an toàn cho trường hợp response từ upstream chưa nén
    # (middleware bị tắt, hoặc nginx tự phục vụ file tĩnh sau này).
    gzip on;
    gzip_vary on;
    gzip_proxied any;          # mặc định nginx KHÔNG nén response đã qua proxy
    gzip_comp_level 5;
    gzip_min_length 1024;      # khớp minCompressSize bên Go
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;
    # Không liệt kê ảnh/video/woff2: đã nén sẵn trong định dạng.

    # Cho phép Certbot xác thực domain qua HTTP trước khi có SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Asset của Vite có hash trong tên file (index-a1b2c3.js) nên cache được
    # vĩnh viễn. Cache-Control do app Go đặt sẵn ("public, max-age=31536000,
    # immutable" trong spaFileServer) — ở đây KHÔNG thêm expires/add_header
    # nữa để tránh gửi trùng 2 header Cache-Control.
    # Block này tách riêng chỉ để tắt access_log cho đỡ rác log.
    location /assets/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Giữ Accept-Encoding của client để upstream Go nén được như ở "/".
        proxy_set_header Accept-Encoding $http_accept_encoding;

        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Chuyển tiếp Accept-Encoding của client để app Go tự nén được.
        # Không đặt dòng này thì nginx vẫn gửi header gốc, nhưng ghi rõ để
        # tránh bị vô hiệu bởi proxy_set_header khác thêm vào sau này.
        proxy_set_header Accept-Encoding $http_accept_encoding;

        # Upload chunk / xử lý ảnh có thể mất thời gian
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Đẩy thẳng body upload sang app, không đệm hết vào đĩa nginx trước
        proxy_request_buffering off;
    }
}
