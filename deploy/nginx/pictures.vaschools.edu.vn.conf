# Vhost cho pictures.vaschools.edu.vn
# App Go chạy binary + systemd, lắng nghe 127.0.0.1:8080 (xem deploy/systemd/s3-upload-tool.service)
#
# Cài đặt:
#   sudo cp deploy/nginx/pictures.vaschools.edu.vn.conf /etc/nginx/sites-available/pictures.vaschools.edu.vn.conf
#   sudo ln -s /etc/nginx/sites-available/pictures.vaschools.edu.vn.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sau đó bật HTTPS bằng Certbot (tự sửa file này thêm block 443 + redirect):
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d pictures.vaschools.edu.vn

server {
    listen 80;
    listen [::]:80;
    server_name pictures.vaschools.edu.vn;

    # Cho phép Certbot xác thực domain qua HTTP trước khi có SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload ảnh có thể khá lớn — khớp với UPLOAD_ABSOLUTE_MAX_MB trong .env (mặc định 200)
        client_max_body_size 200m;

        # Upload chunk / xử lý ảnh có thể mất thời gian
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }
}
